[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poker-ai"
version = "0.1.0"
description = "Local-first No-Limit Hold'em analysis platform (canonical package)."
readme = "README.md"
# Cap <3.14: pyarrow/duckdb (analytics extra) lack cp314 wheels on Windows — use 3.11 (CI).
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Poker AI contributors" }]
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "numba>=0.60,<1",
    "numpy>=2.0,<3",
    "phevaluator>=0.5,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "typer>=0.12,<1",
    "xxhash>=3,<4",
]

# Dev deps: add `pytest-asyncio` when the suite gains async tests (see doc/ROADMAP.md).
[project.optional-dependencies]
analytics = [
    "duckdb>=1.1,<2",
    "pyarrow>=16,<20",
]
ml = [
    "safetensors>=0.4,<1",
    "torch>=2.2,<3",
]
dev = [
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "open-spiel>=1.6,<2",
    "playwright>=1.49,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "safetensors>=0.4,<1",
    "torch>=2.2,<3",
]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.32,<1",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
]

[project.scripts]
poker-ai = "poker_ai.apps.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_ai"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".venv",
    "TexasSolver",
    "artifacts",
    "data",
    "reports",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "NPY"]
ignore = [
    "RUF001",  # en-dash / × in user-facing strings and docs
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311", "S603", "S105", "S106", "NPY002"]
"migrations/env.py" = ["E402"]
"src/poker_ai/learn/**/*.py" = ["S311", "NPY002"]
"src/poker_ai/league/**/*.py" = ["S311", "S101"]
"src/poker_ai/opponents/**/*.py" = ["S311"]
"src/poker_ai/solver/**/*.py" = ["S311", "S310", "S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
mypy_path = "src"
packages = ["poker_ai"]

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "phevaluator.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyspiel", "pyspiel.*", "open_spiel", "open_spiel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast local default (no coverage). Full gate: pytest --cov=poker_ai --cov-fail-under=100
addopts = "-q -m 'not slow'"
markers = [
    "slow: Monte Carlo or perf checks; run with -m slow when not using POKER_AI_SKIP_PERF",
    "ml: PyTorch training / inference (requires pip install -e '.[ml]').",
]

# Pyright / Basedpyright — src layout (see tool.mypy.mypy_path).
[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]
# Bind the venv to this environment so analyzers do not fall back to the workspace
# root (where no .venv exists) when the workspace folder is the parent repo.
venvPath = "."
venv = ".venv"

# Optional ``[ml]`` deps — suppress missing-import noise when torch is not installed.
[[tool.pyright.overrides]]
include = ["src/poker_ai/learn/**", "src/poker_ai/models/**"]
reportMissingImports = false
reportMissingModuleSource = false
