name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  poker-ai:
    name: poker_ai (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: poker_ai

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint, types, tests
        run: task ci

      - name: CLI smoke (--help)
        run: uv run python -m poker_ai --help
